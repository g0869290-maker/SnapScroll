name: Build SnapScroll APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate project ZIP
        id: locate
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found in repository"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        id: extract
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/snapscroll"

          unzip -q "${{ steps.locate.outputs.zip_file }}" \
            -d "$RUNNER_TEMP/snapscroll"

          WRAPPER=$(find "$RUNNER_TEMP/snapscroll" \
            -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "::error::gradlew not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project: $PROJECT_DIR"

      - name: Build APK
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapScroll-debug-APK
          path: ${{ steps.extract.outputs.project_dir }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
